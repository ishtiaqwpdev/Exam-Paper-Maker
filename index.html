<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Exam Paper Maker — Prototype</title>
  <!-- set the theme before first paint (no white flash in dark mode) -->
  <script>(function(){try{var t=localStorage.getItem('pm_theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
  <!-- Optional: if you are online, an Urdu font is loaded for nicer rendering. Offline, the system fallback in styles.css is used. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap">
</head>
<body>
  <div id="root"></div>
  <div id="print-root" aria-hidden="true"></div>
  <div id="toast-root"></div>

  <script src="js/theme.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/math.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/paper-builder.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/paper-renderer.js"></script>
  <script src="js/export.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
